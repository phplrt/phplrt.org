parameters:
  env(DB_PATH): '%kernel.project_dir%/var/data.sqlite'

doctrine:
  dbal:
    default_connection: default
    #use_savepoints: true
    connections:
      default:
        driver: pdo_sqlite
        path: '%env(resolve:DB_PATH)%'
        charset: utf8
        logging: "%kernel.debug%"
        profiling: "%kernel.debug%"
        schema_filter: ~^(?!moonshine_)~
    types:
      App\Domain\Documentation\MenuId: App\Infrastructure\Persistence\Doctrine\Type\MenuIdType
      App\Domain\Documentation\PageId: App\Infrastructure\Persistence\Doctrine\Type\PageIdType
      App\Domain\Documentation\Search\IndexId: App\Infrastructure\Persistence\Doctrine\Type\IndexIdType

  orm:
    connection: ~
    default_entity_manager: ~
    auto_generate_proxy_classes: true
    proxy_dir: '%kernel.cache_dir%/doctrine/orm/Proxies'
    proxy_namespace: Proxies
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    auto_mapping: true
    report_fields_where_declared: true
    enable_lazy_ghost_objects: true
    controller_resolver:
      auto_mapping: false
    mappings:
      App:
        is_bundle: false
        type: attribute
        dir: '%kernel.project_dir%/app/Domain'
        prefix: 'App\Domain'
        alias: App

when@test:
  doctrine:
    dbal:
      connections:
        default:
          # Note: "dbname_suffix" is not applicable to SQLite, since the
          #       connection is addressed by "path" and not by "dbname",
          #       so a dedicated file is used instead.
          #
          # "TEST_TOKEN" is typically set by ParaTest
          path: '%kernel.project_dir%/var/data_test%env(default::TEST_TOKEN)%.sqlite'

when@prod:
  doctrine:
    orm:
      auto_generate_proxy_classes: false
      proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
      metadata_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool

  framework:
    cache:
      pools:
        doctrine.result_cache_pool:
          adapter: cache.app
        doctrine.system_cache_pool:
          adapter: cache.system
