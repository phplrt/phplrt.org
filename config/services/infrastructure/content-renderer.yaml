services:
  _defaults:
    autowire: true
    autoconfigure: true

  #
  # ----------------------------------------------------------------------------
  #  Syntax Highlighting
  # ----------------------------------------------------------------------------
  #

  App\Infrastructure\Highlight\ConceptTheme: ~

  # Note: "php", "json", "bash", "graphql" and other common languages ship with
  #       tempest/highlight and need no registration. The grammar languages
  #       ("pp2", "pp3") are not among them, so those blocks are rendered as
  #       plain text until a Tempest\Highlight\Language is written for them
  #       from the actual grammar — and added here via "addLanguage".
  Tempest\Highlight\Highlighter:
    arguments:
      $theme: '@App\Infrastructure\Highlight\ConceptTheme'

  #
  # ----------------------------------------------------------------------------
  #  Content Rendering
  # ----------------------------------------------------------------------------
  #

  Local\ContentRenderer\ContentRendererInterface:
    class: Local\ContentRenderer\DocumentationRenderer
    arguments:
      $slugger: '@App\Infrastructure\Slug\CaseInsensitiveSlugger'
      $highlighter: '@Tempest\Highlight\Highlighter'
