services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Note: "php", "json", "bash", "graphql" and other common languages are
  #       bundled with tempest/highlight and need no registration.
  #
  # TODO: The "pp2" (phplrt grammar) and "ast" languages are not ported yet,
  #       so they currently fall back to plain text. They have to be
  #       implemented as Tempest\Highlight\Language classes and added here
  #       via "addLanguage" calls.
  Tempest\Highlight\Highlighter: ~

  Local\ContentRenderer\ContentRendererInterface:
    class: Local\ContentRenderer\DocumentationRenderer
    arguments:
      $slugger: '@App\Infrastructure\Slug\CaseInsensitiveSlugger'
