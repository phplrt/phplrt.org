x-environment: &environment
  env_file:
    - path: ./.env.example
      required: true
    - path: ./.env
      required: false

services:
  nginx:
    <<: *environment
    image: nginx:alpine
    container_name: phplrt-nginx
    working_dir: /home/phplrt/phplrt.org
    volumes:
      - .:/home/phplrt/phplrt.org:ro
      - ./docker/nginx/phplrt.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_HTTP_PUBLIC_PORT:-81}:80"
    depends_on:
      - php
    networks:
      - frontend

  php:
    <<: *environment
    build: docker/php
    user: '1000:1000'
    container_name: phplrt-php
    working_dir: /home/phplrt/phplrt.org
    volumes:
      - composer:/home/phplrt/.composer:rw
      - .:/home/phplrt/phplrt.org:rw
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - frontend

networks:
  frontend:
    name: phplrt_org
    driver: bridge

volumes:
  composer:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=${UID:-1000}"
